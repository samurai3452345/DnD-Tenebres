server:
  port: 8081

game:
  player:
    start-location-id: city_square
    respawn-location-id: city_tavern
    start-gold: 50
    death-gold-penalty-percent: 20
    start-items:
      - template: "Длинный меч"
        amount: 1
      - template: "Малое зелье лечения"
        amount: 2
      - template: "Припасы"
        amount: 5

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dnd_tenebres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
