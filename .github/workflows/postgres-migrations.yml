name: PostgreSQL migrations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker runtime
        run: docker info
      - name: Apply all migrations and validate mappings
        run: ./mvnw -B -Dtest=PostgresIntegrationTest test
